<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TiO₂ Photocatalytic Degradation Analyzer</title>
<meta name="description" content="Анализ фотокаталитической деградации красителя на TiO₂ по фотографиям: оптическая плотность, кинетика первого порядка, k и t½ — прямо в браузере.">
<meta name="theme-color" content="#2b2b2b">
<meta property="og:title" content="TiO₂ Photocatalytic Degradation Analyzer">
<meta property="og:description" content="Оптическая плотность, кинетика 1-го порядка, k и t½ по фотографиям — в браузере.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔬%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="win">
  <div id="titlebar">
    <div class="lights" aria-hidden="true"><i>×</i><i>−</i><i>⤢</i></div>
    <div class="ttl">TiO₂ Photocatalytic Degradation Analyzer</div>
  </div>
  <div id="app">
    <header id="hdr">
      <span class="h1">🔬&nbsp; TiO₂ Photocatalytic Degradation Analyzer</span>
      <span class="formula">A = −log₁₀(I/I₀) | ln(&lt;A&gt;(t)/&lt;A&gt;(0)) = −k·t | t₁/₂ = ln2/k</span>
    </header>
    <div id="split">
      <div id="top">
        <div id="tabbar" role="tablist"></div>
        <div id="pane"></div>
      </div>
      <div id="sash" role="separator" aria-orientation="horizontal"></div>
      <div id="bottom">
        <section class="grp fill">
          <span class="gt">📊&nbsp; Результаты</span>
          <div class="tblwrap">
            <table class="res">
              <colgroup><col style="width:38px"><col><col style="width:112px"><col style="width:96px"><col style="width:104px"></colgroup>
              <thead><tr><th>№</th><th>Эксперимент</th><th>k (с⁻¹)</th><th>t₁/₂</th><th>Метод</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </section>
        <section class="grp fill">
          <span class="gt">📈&nbsp; Кинетика деградации</span>
          <div class="plotwrap"><canvas id="plot"></canvas></div>
        </section>
      </div>
    </div>
    <div id="status">Нажмите '+' для нового эксперимента</div>
  </div>
</div>
<div id="modal"></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
